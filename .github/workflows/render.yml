name: Render tournament video

on:
  workflow_dispatch:
    inputs:
      url:
        description: Game URL on your host (leave empty to use the GAME_URL repository variable)
        required: false
        type: string
      fighters:
        description: Number of fighters (multiple of 4)
        default: '16'
        type: string
      speed:
        description: Game speed (0.2 - 2)
        default: '1'
        type: string
      height:
        description: Output height
        default: '240'
        type: string
      intro:
        description: Intro (random, none, who, survive, predict, versus, countdown, elim)
        default: random
        type: string
      highlights:
        description: Number of highlight clips (0 = off)
        default: '4'
        type: string
      match_card:
        description: Seconds of the pre-match card (0 = off)
        default: '3.4'
        type: string
      lang:
        description: Intro / match card / highlight language (en or vi)
        default: en
        type: string
      video_minutes:
        description: Length of the tournament footage in minutes, for quick tests (0 = full tournament; intro, highlights and outro are added on top)
        default: '0'
        type: string
      max_minutes:
        description: Maximum recording time in minutes
        default: '60'
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-dejavu-core
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render
        env:
          GAME_URL: ${{ inputs.url || vars.GAME_URL || 'https://nangmua.vn/2d/2d/' }}
        run: >
          node src/render.mjs
          --fighters "${{ inputs.fighters }}"
          --speed "${{ inputs.speed }}"
          --height "${{ inputs.height }}"
          --intro "${{ inputs.intro }}"
          --highlights "${{ inputs.highlights }}"
          --lang "${{ inputs.lang }}"
          --match-card "${{ inputs.match_card }}"
          --video-minutes "${{ inputs.video_minutes }}"
          --max-minutes "${{ inputs.max_minutes }}"
          --out output/tournament.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-video
          path: output/tournament.mp4
