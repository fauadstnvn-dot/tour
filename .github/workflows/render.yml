name: Render tournament video

on:
  schedule:
    # 15:30 UTC daily: renders for a few hours, the video goes public at PUBLISH_AT_UTC (19:30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      fighters:
        description: Number of fighters (multiple of 4)
        default: '16'
        type: string
      speed:
        description: Game speed (0.2 - 2)
        default: '1'
        type: string
      height:
        description: Output height (1440 = 2K, 1080 = Full HD)
        default: '1440'
        type: string
      intro:
        description: Intro (random, none, who, survive, predict, versus, countdown, elim)
        default: random
        type: string
      highlights:
        description: Number of highlight clips (0 = off)
        default: '0'
        type: string
      match_card:
        description: Seconds of the pre-match card (0 = off)
        default: '3.4'
        type: string
      lang:
        description: Intro / match card / highlight language (en or vi)
        default: en
        type: string
      video_minutes:
        description: Length of the tournament footage in minutes, for quick tests (0 = full tournament; intro, highlights and outro are added on top)
        default: '0'
        type: string
      max_minutes:
        description: Maximum recording time in minutes
        default: '300'
        type: string
      upload:
        description: Upload to YouTube after rendering (true/false)
        default: 'true'
        type: string
      privacy:
        description: YouTube privacy (public, unlisted, private)
        default: public
        type: string
      publish_at_utc:
        description: Public release time in UTC (HH:MM). Empty = publish immediately
        default: '19:30'
        type: string
      allow_no_scenery:
        description: Allow recording without scenery (default false - the run fails instead of producing a scenery-less video)
        default: 'false'
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-dejavu-core
          ffmpeg -version | head -1
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Render
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
        run: >
          node src/render.mjs
          --fighters "${{ inputs.fighters || '16' }}"
          --speed "${{ inputs.speed || '1' }}"
          --height "${{ inputs.height || '1440' }}"
          --intro "${{ inputs.intro || 'random' }}"
          --highlights "${{ inputs.highlights || '0' }}"
          --lang "${{ inputs.lang || 'en' }}"
          --match-card "${{ inputs.match_card || '3.4' }}"
          --video-minutes "${{ inputs.video_minutes || '0' }}"
          --max-minutes "${{ inputs.max_minutes || '300' }}"
          --out output/tournament.mp4
          ${{ inputs.allow_no_scenery == 'true' && '--allow-no-scenery' || '' }}
      - name: Generate SEO with DeepSeek and upload to YouTube
        id: publish
        if: ${{ inputs.upload != 'false' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          pip install -r requirements.txt
          python -m publish.publish --video output/tournament.mp4 --privacy "${{ inputs.privacy || 'public' }}" --publish-at "${{ github.event_name == 'schedule' && '19:30' || inputs.publish_at_utc }}"
      - name: Keep the video if it was not uploaded
        if: ${{ always() && steps.publish.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tournament-video
          path: |
            output/tournament.mp4
            output/tournament.thumb.jpg
            output/tournament.json
          retention-days: 7
          if-no-files-found: ignore
